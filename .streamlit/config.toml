[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f6f8fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2937"
font = "sans serif"

[server]
# Skip Streamlit's first-run "Email:" prompt, which otherwise blocks startup
showEmailPrompt = false

[browser]
gatherUsageStats = false
